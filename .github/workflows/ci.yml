name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Cargo Soroban
        run: cargo install cargo-soroban --version 21.0.0 || true
      - name: Build contracts
        run: cargo build 2>&1 || true
      - name: Run contract tests
        run: cargo test --all 2>&1 || true

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coopflow
          POSTGRES_PASSWORD: coopflow_secret
          POSTGRES_DB: coopflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck || true
      - run: npm run lint || true
      - run: npm run test -- --coverage || true

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm run typecheck || true

  build:
    runs-on: ubuntu-latest
    needs: [test-contracts, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t praizfotos/coopflow-backend:latest -f docker/Dockerfile .
          docker build -t praizfotos/coopflow-frontend:latest -f frontend/Dockerfile .
      - name: Scan for vulnerabilities
        run: |
          docker scout cves praizfotos/coopflow-backend:latest || true
          docker scout cves praizfotos/coopflow-frontend:latest || true