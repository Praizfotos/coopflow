name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Cargo Soroban
        run: cargo install cargo-soroban --version 21.0.0
      - name: Build contracts
        run: cargo build
      - name: Run contract tests
        run: cargo test --all
      - name: Check contract coverage
        run: cargo tarpaulin --out Xml

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coopflow
          POSTGRES_PASSWORD: coopflow_secret
          POSTGRES_DB: coopflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --coverage

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [test-contracts, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t coopflow-backend -f docker/Dockerfile .
          docker build -t coopflow-frontend -f frontend/Dockerfile .
      - name: Scan for vulnerabilities
        run: |
          docker scout cves coopflow-backend || true
          docker scout cves coopflow-frontend || true

  deploy-testnet:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to testnet
        run: |
          echo "Deploying to testnet..."
          docker compose -f docker/docker-compose.testnet.yml up -d